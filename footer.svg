<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Animated futuristic gamer programmer hacker cyber security AI banner">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset=".45" stop-color="#07101d"/><stop offset="1" stop-color="#10051b"/></linearGradient>
  <linearGradient id="neon" x2="1"><stop stop-color="#00eaff"/><stop offset=".5" stop-color="#7c3cff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <linearGradient id="green" x2="1"><stop stop-color="#00ff9d"/><stop offset="1" stop-color="#00d9ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#15304c" stroke-width="1" opacity=".42"/></pattern>
  <pattern id="hex" width="70" height="60" patternUnits="userSpaceOnUse"><path d="M17 2L53 2L68 30L53 58L17 58L2 30Z" fill="none" stroke="#00eaff" opacity=".08"/></pattern>
  <clipPath id="terminal"><rect x="460" y="110" width="390" height="190" rx="12"/></clipPath>
</defs>

<!-- BACKGROUND -->
<rect width="1600" height="400" fill="url(#bg)"/>
<rect width="1600" height="400" fill="url(#grid)"/>
<rect width="1600" height="400" fill="url(#hex)"/>
<ellipse cx="800" cy="210" rx="500" ry="170" fill="#00eaff" opacity=".06" filter="url(#soft)"/>

<!-- animated particles -->
<g fill="#00eaff">
 <circle cx="180" cy="70" r="2"><animate attributeName="cy" values="70;330;70" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="360" cy="330" r="2"><animate attributeName="cy" values="330;60;330" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="1030" cy="60" r="2"><animate attributeName="cy" values="60;330;60" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="1430" cy="330" r="2"><animate attributeName="cy" values="330;65;330" dur="5.5s" repeatCount="indefinite"/></circle>
</g>

<!-- TOP HUD -->
<g font-family="Arial, sans-serif">
 <rect x="28" y="20" width="190" height="45" rx="12" fill="#071322" stroke="#ff2b78" opacity=".95"/>
 <text x="45" y="39" fill="#ff3d8b" font-size="11" font-weight="700">LEVEL UP</text>
 <text x="45" y="56" fill="#fff" font-size="13">XP 99,999</text>
 <rect x="113" y="39" width="85" height="8" rx="4" fill="#32152a"/>
 <rect x="113" y="39" width="68" height="8" rx="4" fill="#ff2b78"><animate attributeName="width" values="68;85;68" dur="2s" repeatCount="indefinite"/></rect>

 <text x="800" y="31" text-anchor="middle" fill="#a7c7df" font-size="10" letter-spacing="4">CODE • CREATE • HACK • SECURE • INTELLIGENCE</text>
 <text x="800" y="60" text-anchor="middle" fill="url(#neon)" font-size="24" font-weight="900" letter-spacing="6">BUILD THE FUTURE</text>

 <rect x="1380" y="20" width="190" height="45" rx="12" fill="#071322" stroke="#00ff9d"/>
 <text x="1400" y="39" fill="#91a9bd" font-size="10">SYSTEM STATUS</text>
 <text x="1400" y="56" fill="#00ff9d" font-size="13" font-weight="700">● SECURE</text>
 <path d="M1538 37v-5a9 9 0 0 0-18 0v5" fill="none" stroke="#00eaff" stroke-width="2"/>
 <rect x="1515" y="37" width="28" height="20" rx="4" fill="none" stroke="#00eaff" stroke-width="2"/>
</g>

<!-- FOUR DOMAIN LABELS -->
<g font-family="Arial,sans-serif" font-weight="800">
 <g transform="translate(55 88)">
   <text x="0" y="20" fill="#ff397d" font-size="22">🎮 GAMER</text><text x="2" y="40" fill="#ff91b4" font-size="10" letter-spacing="2">PLAY • COMPETE • WIN</text>
 </g>
 <g transform="translate(410 88)">
   <text x="0" y="20" fill="#00cfff" font-size="22">&lt;/&gt; PROGRAMMER</text><text x="2" y="40" fill="#8eeaff" font-size="10" letter-spacing="2">CODE • BUILD • SHIP</text>
 </g>
 <g transform="translate(905 88)">
   <text x="0" y="20" fill="#00ff9d" font-size="22">◈ CYBER SECURITY</text><text x="2" y="40" fill="#7dffc8" font-size="10" letter-spacing="2">PROTECT • DEFEND • ENCRYPT</text>
 </g>
 <g transform="translate(1260 88)">
   <text x="0" y="20" fill="#c77dff" font-size="22">✦ ARTIFICIAL INTELLIGENCE</text><text x="2" y="40" fill="#e2b8ff" font-size="10" letter-spacing="2">LEARN • THINK • CREATE</text>
 </g>
</g>

<!-- GAMER ZONE -->
<g transform="translate(45 140)" filter="url(#glow)">
 <rect x="0" y="0" width="330" height="165" rx="18" fill="#090817" stroke="#ff2b78" opacity=".95"/>
 <rect x="18" y="18" width="180" height="105" rx="8" fill="#050a14" stroke="#ff397d"/>
 <path d="M30 103 L75 68 L110 88 L150 45 L185 72" fill="none" stroke="#ff397d" stroke-width="3"/>
 <circle cx="150" cy="45" r="4" fill="#fff"/>
 <path d="M230 80 C218 83 210 73 213 62L222 35C225 26 235 21 245 25L260 30H285L300 25C310 21 320 26 323 35L332 62C335 73 327 83 316 80L299 70L286 57H259L246 70Z" fill="#080f1e" stroke="#ff2b78" stroke-width="3" transform="translate(-8 0) scale(.78)"/>
 <circle cx="285" cy="46" r="5" fill="#ff2b78"/>
 <path d="M245 45h22M256 34v22" stroke="#ff8ab1" stroke-width="4"/>
 <text x="22" y="145" fill="#ff91b4" font-size="10" letter-spacing="2">FPS 240 • PING 18ms • RANK #01</text>
</g>

<!-- PROGRAMMER TERMINAL -->
<g filter="url(#glow)">
 <rect x="405" y="105" width="470" height="205" rx="18" fill="#040913" stroke="#00d9ff" stroke-width="2"/>
 <rect x="425" y="125" width="430" height="165" rx="10" fill="#02070d" stroke="#164e63"/>
 <circle cx="442" cy="140" r="5" fill="#ff405d"/><circle cx="458" cy="140" r="5" fill="#ffc145"/><circle cx="474" cy="140" r="5" fill="#29e27f"/>
 <g clip-path="url(#terminal)" font-family="monospace" font-size="12">
   <text x="445" y="166" fill="#00eaff">$ npm run build:future</text>
   <text x="445" y="188" fill="#22c55e">✓ compile</text><text x="520" y="188" fill="#94a3b8"> TypeScript / React</text>
   <text x="445" y="208" fill="#22c55e">✓ deploy</text><text x="520" y="208" fill="#94a3b8"> cloud edge nodes</text>
   <text x="445" y="228" fill="#a855f7">AI</text><text x="475" y="228" fill="#cbd5e1"> model inference ready</text>
   <text x="445" y="248" fill="#00eaff">git:</text><text x="480" y="248" fill="#cbd5e1"> main → production</text>
   <text x="445" y="273" fill="#00ff9d">root@future:~#</text><rect x="555" y="261" width="8" height="15" fill="#00eaff"><animate attributeName="opacity" values="1;0;1" dur=".7s" repeatCount="indefinite"/></rect>
 </g>
 <rect x="425" y="300" width="430" height="2" fill="#00eaff"><animate attributeName="width" values="50;430;50" dur="3s" repeatCount="indefinite"/></rect>
</g>

<!-- HACKER / SECURITY -->
<g transform="translate(895 130)" filter="url(#glow)">
 <circle cx="150" cy="78" r="72" fill="#00ff9d" opacity=".08"/>
 <path d="M150 18 L220 48V98C220 150 187 181 150 196C113 181 80 150 80 98V48Z" fill="#031b18" stroke="#00ff9d" stroke-width="4"/>
 <rect x="118" y="86" width="64" height="48" rx="7" fill="#03100f" stroke="#00eaff" stroke-width="3"/>
 <path d="M130 86V72a20 20 0 0 1 40 0v14" fill="none" stroke="#00eaff" stroke-width="4"/>
 <circle cx="150" cy="108" r="6" fill="#00ff9d"/>
 <path d="M150 114v10" stroke="#00ff9d" stroke-width="3"/>
 <g font-family="monospace" font-size="10">
  <rect x="5" y="30" width="72" height="28" rx="7" fill="#061b19" stroke="#00ff9d"/><text x="16" y="48" fill="#00ff9d">FIREWALL ON</text>
  <rect x="223" y="35" width="82" height="28" rx="7" fill="#061b19" stroke="#00ff9d"/><text x="235" y="53" fill="#00ff9d">AES-256</text>
  <rect x="25" y="145" width="95" height="28" rx="7" fill="#061b19" stroke="#00eaff"/><text x="36" y="163" fill="#00eaff">THREATS: 0</text>
  <rect x="195" y="150" width="110" height="28" rx="7" fill="#061b19" stroke="#00eaff"/><text x="207" y="168" fill="#00eaff">ACCESS OK</text>
 </g>
 <animate attributeName="opacity" values=".72;1;.72" dur="2s" repeatCount="indefinite"/>
</g>

<!-- AI ZONE -->
<g transform="translate(1245 130)" filter="url(#glow)">
 <circle cx="135" cy="82" r="72" fill="#9d4edd" opacity=".08"/>
 <path d="M135 22c-28 0-48 22-48 50v55c0 28 20 48 48 48s48-20 48-48V72c0-28-20-50-48-50Z" fill="#0b0718" stroke="#b86cff" stroke-width="3"/>
 <circle cx="118" cy="82" r="12" fill="#c77dff"/><circle cx="152" cy="82" r="12" fill="#00eaff"/>
 <path d="M118 82h34M135 65v70" stroke="#e7c8ff" stroke-width="2"/>
 <g stroke="#b86cff" stroke-width="2" opacity=".8">
  <path d="M87 62L45 35M183 62L225 35M90 125L45 145M180 125L225 145"/>
 </g>
 <g fill="#b86cff"><circle cx="45" cy="35" r="5"/><circle cx="225" cy="35" r="5"/><circle cx="45" cy="145" r="5"/><circle cx="225" cy="145" r="5"/></g>
 <text x="28" y="183" fill="#d9a8ff" font-family="monospace" font-size="10">NEURAL • ML • DEEP LEARNING</text>
</g>

<!-- LIVE DATA BAR -->
<g font-family="Arial,sans-serif">
 <rect x="30" y="330" width="1540" height="48" rx="14" fill="#040914" stroke="url(#neon)" stroke-width="2"/>
 <g font-size="10" font-weight="700">
  <text x="55" y="350" fill="#00eaff">◉ REAL-TIME</text><text x="55" y="365" fill="#71869a">CONNECTED</text>
  <text x="245" y="350" fill="#00eaff">☁ CLOUD SYNC</text><text x="245" y="365" fill="#71869a">SECURE</text>
  <text x="430" y="350" fill="#ffce4a">⚡ PERFORMANCE</text><text x="430" y="365" fill="#71869a">BOOST +99%</text>
  <text x="630" y="350" fill="#c77dff">♟ COMMUNITY</text><text x="630" y="365" fill="#71869a">ONLINE 12.8K</text>
  <text x="830" y="350" fill="#00ff9d">♜ ACHIEVEMENTS</text><text x="830" y="365" fill="#71869a">UNLOCKED</text>
  <text x="1035" y="350" fill="#00eaff">&lt;/&gt; OPEN SOURCE</text><text x="1035" y="365" fill="#71869a">FREEDOM</text>
  <text x="1235" y="350" fill="#ff4bd8">◈ AI POWERED</text><text x="1235" y="365" fill="#71869a">MODEL ONLINE</text>
  <text x="1430" y="350" fill="#00ff9d">✓ ZERO TRUST</text><text x="1430" y="365" fill="#71869a">PROTECTED</text>
 </g>
</g>

<!-- MOVING SCAN -->
<rect x="0" y="0" width="1600" height="2" fill="#00eaff" opacity=".35">
 <animate attributeName="y" from="-3" to="403" dur="4s" repeatCount="indefinite"/>
</rect>
<rect x="8" y="8" width="1584" height="384" rx="22" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".75"/>
</svg>