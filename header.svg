<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Background & Grid Styling -->
    <radialGradient id="hologram-beam" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Continuous Loop Keyframes */
      @keyframes floatBot {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      
      @keyframes rotateWheel {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rotateCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes shipMove {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(180px); }
      }

      @keyframes dropItem {
        0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
        30% { opacity: 1; transform: translate(15px, 20px) scale(1); }
        80% { opacity: 1; transform: translate(45px, 75px) scale(0.9); }
        100% { opacity: 0; transform: translate(50px, 95px) scale(0.4); }
      }

      @keyframes pulseBeam {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .floating-bot { animation: floatBot 4.5s ease-in-out infinite; transform-origin: 500px 240px; }
      .rotate-cw { animation: rotateWheel 14s linear infinite; transform-origin: 500px 130px; }
      .gear-spin { animation: rotateWheel 6s linear infinite; transform-origin: 755px 170px; }
      .gear-spin-rev { animation: rotateCounter 4s linear infinite; transform-origin: 795px 190px; }
      .ship-anim { animation: shipMove 7s ease-in-out infinite; }
      .stream-item-1 { animation: dropItem 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .stream-item-2 { animation: dropItem 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite 0.9s; }
      .stream-item-3 { animation: dropItem 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite 1.8s; }
      .hologram-light { animation: pulseBeam 3s ease-in-out infinite; }
      .flow-circuit { stroke-dasharray: 6 6; animation: dashFlow 1.5s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Deep Space Background -->
  <rect width="1000" height="520" rx="16" fill="#090d16" />

  <!-- Perspective Isometric Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="420" x2="1000" y2="420" />
    <line x1="0" y1="465" x2="1000" y2="465" />
    <line x1="0" y1="510" x2="1000" y2="510" />
    <line x1="500" y1="360" x2="0" y2="520" />
    <line x1="500" y1="360" x2="250" y2="520" />
    <line x1="500" y1="360" x2="500" y2="520" />
    <line x1="500" y1="360" x2="750" y2="520" />
    <line x1="500" y1="360" x2="1000" y2="520" />
  </g>

  <!-- Left/Right Ambient Circuit Traces -->
  <g opacity="0.4" stroke="#0284c7" stroke-width="2" fill="none">
    <path d="M 60 120 L 140 120 L 170 150 L 170 210" class="flow-circuit" />
    <circle cx="60" cy="120" r="3.5" fill="#38bdf8" />
    <path d="M 940 120 L 860 120 L 830 150 L 830 210" class="flow-circuit" />
    <circle cx="940" cy="120" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Center Hologram Pedestal -->
  <g transform="translate(500, 360)">
    <polygon points="-110,-10 110,-10 160,20 -160,20" fill="url(#hologram-beam)" class="hologram-light" />
    <ellipse cx="0" cy="0" rx="110" ry="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#neon-glow)" />
    <ellipse cx="0" cy="0" rx="75" ry="14" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="35" ry="6" fill="#38bdf8" class="hologram-light" />
  </g>

  <!-- Pipeline River Track (Bottom) -->
  <g transform="translate(500, 415)">
    <!-- Circuit Canal Loop -->
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#0b1329" stroke="#1e293b" stroke-width="4" />
    <path d="M -220 0 L 220 0" stroke="#0284c7" stroke-width="8" opacity="0.6" stroke-linecap="round" />
    <path d="M -220 0 L 220 0" stroke="#38bdf8" stroke-width="2" class="flow-circuit" />

    <!-- Moving Deployment Cargo Ship -->
    <g class="ship-anim">
      <g transform="translate(0, -6)">
        <path d="M -25 8 L -18 18 L 18 18 L 25 8 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
        <!-- Containers -->
        <rect x="-14" y="-4" width="9" height="12" rx="1.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
        <rect x="-3" y="-4" width="9" height="12" rx="1.5" fill="#f59e0b" stroke="#fde047" stroke-width="1" />
        <rect x="8" y="-4" width="9" height="12" rx="1.5" fill="#10b981" stroke="#6ee7b7" stroke-width="1" />
      </g>
    </g>
    <text x="0" y="32" fill="#64748b" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="2">PROJECT DEPLOYMENTS</text>
  </g>

  <!-- Upper CI/CD Orbit Ring -->
  <g>
    <circle cx="500" cy="130" r="75" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 6" />
    <g class="rotate-cw">
      <!-- Orbit Node 1: Git Branch -->
      <g transform="translate(500, 55)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#neon-glow)" />
        <path d="M -4 -6 L -4 6 M 4 -2 L 4 -6 M -4 2 Q 4 2 4 -2" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
        <circle cx="-4" cy="-6" r="2" fill="#38bdf8" />
        <circle cx="-4" cy="6" r="2" fill="#38bdf8" />
        <circle cx="4" cy="-6" r="2" fill="#38bdf8" />
      </g>
      <!-- Orbit Node 2: Pipeline Merge -->
      <g transform="translate(575, 130)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
        <path d="M -5 -5 L 5 5 M -5 5 L 5 -5" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- Orbit Node 3: Settings/Build -->
      <g transform="translate(500, 205)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
      </g>
      <!-- Orbit Node 4: Commit -->
      <g transform="translate(425, 130)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#34d399" stroke-width="2" />
        <circle cx="0" cy="0" r="4" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Bot & Tentacles Structure -->
  <g class="floating-bot">
    
    <!-- Arm 1 (Top-Left): Code Terminal Window -->
    <path d="M 455 240 C 370 240, 310 190, 270 200" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 455 240 C 370 240, 310 190, 270 200" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Terminal Floating Screen -->
    <g transform="translate(160, 140)">
      <rect width="130" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#neon-glow)" />
      <rect width="130" height="18" rx="8" fill="#1e293b" />
      <circle cx="12" cy="9" r="3" fill="#ef4444" />
      <circle cx="22" cy="9" r="3" fill="#f59e0b" />
      <circle cx="32" cy="9" r="3" fill="#10b981" />
      <!-- Simulated Code Lines -->
      <text x="12" y="36" fill="#c084fc" font-size="9" font-family="'Fira Code', monospace">func loop() {</text>
      <text x="22" y="50" fill="#38bdf8" font-size="9" font-family="'Fira Code', monospace">build(repo)</text>
      <text x="22" y="64" fill="#34d399" font-size="9" font-family="'Fira Code', monospace">deploy(prod)</text>
      <text x="12" y="78" fill="#c084fc" font-size="9" font-family="'Fira Code', monospace">}</text>
    </g>

    <!-- Arm 2 (Bottom-Left): Pull Request Pin -->
    <path d="M 465 260 C 390 280, 330 290, 290 330" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 465 260 C 390 280, 330 290, 290 330" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <g transform="translate(280, 290)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
      <rect x="-35" y="-12" width="70" height="22" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
      <text x="0" y="3" fill="#0f172a" font-size="8.5" font-family="'Fira Code', monospace" font-weight="bold" text-anchor="middle">PR #MERGE</text>
      <ellipse cx="0" cy="46" rx="14" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-circuit" />
    </g>

    <!-- Arm 3 (Top-Right): CI/CD Wrench -->
    <path d="M 545 240 C 620 230, 660 190, 710 200" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 545 240 C 620 230, 660 190, 710 200" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Wrench Tool -->
    <g transform="translate(710, 200) rotate(-25)">
      <path d="M -8 -20 L 8 -20 L 5 -5 L 5 25 L -5 25 L -5 -5 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="0" cy="-20" r="10" fill="none" stroke="#cbd5e1" stroke-width="3" />
    </g>

    <!-- Arm 4 (Bottom-Right): Magnet Attraction -->
    <path d="M 535 260 C 600 270, 650 280, 710 280" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 535 260 C 600 270, 650 280, 710 280" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Magnet -->
    <g transform="translate(710, 280) rotate(15)">
      <path d="M -10 -15 C -10 -25, 25 -25, 25 -15 L 25 5 L 12 5 L 12 -12 C 12 -16, 3 -16, 3 -12 L 3 5 L -10 5 Z" fill="#ef4444" />
      <rect x="-10" y="2" width="13" height="7" fill="#f8fafc" />
      <rect x="12" y="2" width="13" height="7" fill="#f8fafc" />
    </g>

    <!-- Central Octopus-Bot Body -->
    <g transform="translate(500, 240)">
      <!-- Head Dome -->
      <ellipse cx="0" cy="-10" rx="52" ry="46" fill="url(#neon-blue)" stroke="#38bdf8" stroke-width="3" filter="url(#neon-glow)" />
      <!-- Gloss Specular Highlight -->
      <path d="M -30 -35 Q 0 -50 30 -35 Q 0 -42 -30 -35" fill="#ffffff" opacity="0.4" />
      <!-- Visor Screen -->
      <rect x="-36" y="-22" width="72" height="34" rx="14" fill="#030712" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Glowing Animated Eyes -->
      <ellipse cx="-16" cy="-5" rx="6" ry="8" fill="#38bdf8">
        <animate attributeName="ry" values="8;1;8" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="16" cy="-5" rx="6" ry="8" fill="#38bdf8">
        <animate attributeName="ry" values="8;1;8" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <!-- Base Belt -->
      <rect x="-42" y="16" width="84" height="12" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
    </g>
  </g>

  <!-- Right Section: CI/CD Status Hub Gears -->
  <g transform="translate(0, 0)">
    <!-- Big Gear -->
    <g class="gear-spin">
      <circle cx="755" cy="170" r="28" fill="none" stroke="#475569" stroke-width="6" stroke-dasharray="14 10" />
      <circle cx="755" cy="170" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    </g>
    <!-- Small Connected Gear -->
    <g class="gear-spin-rev">
      <circle cx="795" cy="190" r="18" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="8 6" />
      <circle cx="795" cy="190" r="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    </g>

    <!-- CI/CD Text Label -->
    <text x="755" y="238" fill="#f8fafc" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="1">CI/CD</text>
    <text x="755" y="254" fill="#38bdf8" font-size="11" font-family="'Fira Code', monospace" font-weight="600" letter-spacing="3">PIPELINE</text>

    <!-- PASS Badge Pill -->
    <g transform="translate(775, 130)">
      <rect width="64" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <path d="M 12 10 L 16 14 L 24 7" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="14" fill="#34d399" font-size="10" font-family="'Fira Code', monospace" font-weight="bold">PASS</text>
    </g>
  </g>

  <!-- Star & Contribution Collector Bucket -->
  <g transform="translate(800, 340)">
    <!-- Jar/Bucket -->
    <path d="M -35 0 L 35 0 L 26 70 L -26 70 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="35" ry="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Counter Badge Display -->
    <rect x="-24" y="24" width="48" height="28" rx="4" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="38" fill="#22c55e" font-size="10" font-family="'Fira Code', monospace" font-weight="bold" text-anchor="middle">▲ 4,102</text>
    <text x="0" y="47" fill="#64748b" font-size="8" font-family="'Fira Code', monospace" text-anchor="middle">COMMITS</text>
    <text x="0" y="86" fill="#64748b" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="1">CONTRIBUTIONS</text>
  </g>

  <!-- Flowing Animated Particles Dropping into Bucket -->
  <g transform="translate(735, 275)">
    <!-- Star Token 1 -->
    <g class="stream-item-1">
      <circle cx="0" cy="0" r="8" fill="#10b981" stroke="#6ee7b7" stroke-width="1" />
      <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#ffffff" />
    </g>
    <!-- Star Token 2 -->
    <g class="stream-item-2">
      <circle cx="0" cy="0" r="7" fill="#3b82f6" stroke="#93c5fd" stroke-width="1" />
      <text x="0" y="3" fill="#ffffff" font-size="7" font-weight="bold" text-anchor="middle">✓</text>
    </g>
    <!-- Star Token 3 -->
    <g class="stream-item-3">
      <circle cx="0" cy="0" r="8" fill="#f59e0b" stroke="#fde047" stroke-width="1" />
      <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Bottom Catchphrase Banner -->
  <g transform="translate(500, 495)">
    <text x="0" y="0" fill="#f8fafc" font-size="14" font-family="'Fira Code', monospace" font-weight="600" text-anchor="middle" letter-spacing="3">
      CONTINUOUSLY IMPROVING <tspan fill="#38bdf8">//</tspan> CONTINUOUSLY DEPLOYING
    </text>
  </g>
</svg>
